<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Phantasmagoria Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-brand h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .auth-brand p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .card-header {
            padding: 1.5rem 3rem 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 0;
        }

        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }

        .card-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .auth-body {
            padding: 2rem 3rem 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .btn-auth {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-auth:hover:not(:disabled) {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg-box {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .msg-error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .msg-success {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <header class="auth-brand">
            <h1>Phantasmagoria Analytics &amp; Intelligence Dashboard</h1>
            <p>University of Eastminster Alumni Network</p>
        </header>

        <div class="auth-card">
            <div class="card-header">
                <h2>Set New Password</h2>
                <p>Enter your new password below. It must be at least 8 characters.</p>
            </div>
            <div class="auth-body">
                <div id="msg-error" class="msg-box msg-error"></div>
                <div id="msg-success" class="msg-box msg-success"></div>

                <form id="reset-form">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="At least 8 characters" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Repeat your new password" required minlength="8">
                    </div>
                    <button type="button" id="submit-btn" class="btn-auth">Save New Password</button>
                </form>

                <a href="auth.html" id="back-link" class="back-link">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const btn     = document.getElementById('submit-btn');
        const errBox  = document.getElementById('msg-error');
        const succBox = document.getElementById('msg-success');

        // Extract token and optional redirect from the URL
        const params      = new URLSearchParams(window.location.search);
        const token       = params.get('token');
        const redirectUrl = params.get('redirect'); // not used on CW2 — we always redirect to auth.html

        // If no token, disable form immediately
        if (!token) {
            errBox.textContent = 'Error: No reset token found in the URL. Please use the link from your email.';
            errBox.style.display = 'block';
            btn.disabled = true;
        }

        btn.addEventListener('click', async () => {
            const newPassword = document.getElementById('new-password').value;
            const confirm     = document.getElementById('confirm-password').value;

            errBox.style.display  = 'none';
            succBox.style.display = 'none';

            if (newPassword.length < 8) {
                errBox.textContent = 'Password must be at least 8 characters.';
                errBox.style.display = 'block';
                return;
            }

            if (newPassword !== confirm) {
                errBox.textContent = 'Passwords do not match. Please try again.';
                errBox.style.display = 'block';
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Saving...';

            try {
                // Fetch CSRF token from the CW2 proxy
                let csrfToken = '';
                try {
                    const csrfRes  = await fetch('/api/csrf-token', { credentials: 'include' });
                    const csrfData = await csrfRes.json();
                    if (csrfData.success) csrfToken = csrfData.csrfToken;
                } catch (e) { /* non-fatal */ }

                const response = await fetch('/api/auth/reset-password', {
                    method:  'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    succBox.textContent = '✓ Password updated successfully! Redirecting to login...';
                    succBox.style.display = 'block';
                    document.getElementById('reset-form').style.display = 'none';
                    setTimeout(() => { window.location.href = 'auth.html'; }, 2500);
                } else {
                    errBox.textContent = data.message || 'Failed to reset password. The link may have expired.';
                    errBox.style.display = 'block';
                    btn.disabled    = false;
                    btn.textContent = 'Save New Password';
                }
            } catch (err) {
                errBox.textContent = 'Server error. Could not connect to Phantasmagoria. Please try again.';
                errBox.style.display = 'block';
                btn.disabled    = false;
                btn.textContent = 'Save New Password';
            }
        });
    </script>
</body>
</html>
