<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantasmagoria | Dashboard Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <style>

        .auth-container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-brand h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .auth-brand p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 1.25rem;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .auth-tab.active {
            color: var(--accent);
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .auth-body {
            padding: 2.5rem 3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-top: -0.5rem;
            margin-bottom: 2rem;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-auth {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-auth:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .hidden { display: none !important; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Branding outside card -->
        <header class="auth-brand">
            <h1>Phantasmagoria Analytics & Intelligence Dashboard</h1>
            <p>University of Eastminster Alumni Network</p>
        </header>

        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">Login</button>
                <button class="auth-tab" id="tab-register">Register</button>
            </div>

            <div class="auth-body">
                <!-- Login Form -->
                <div id="login-form-container">
                    <div id="login-error" class="error-message"></div>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">University Email</label>
                            <input type="email" id="login-email" placeholder="e.g. john@westminster.ac.uk" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                        <div class="form-options">
                            <a href="#" class="forgot-link" id="forgot-password-link">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn-auth">Sign In</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="register-form-container" class="hidden">
                    <div id="register-error" class="error-message"></div>
                    <div id="register-success" class="success-message"></div>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-email">University Email</label>
                            <input type="email" id="reg-email" placeholder="e.g. john@westminster.ac.uk" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" placeholder="Min 8 chars, 1 uppercase, 1 special" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-role">Access Level</label>
                            <select id="reg-role" style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-family: inherit;">
                                <option value="alumni">Alumni Viewer</option>
                                <option value="developer">University Analyst (Dev)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-auth">Register</button>
                    </form>
                </div>

                <!-- Forgot Password Form -->
                <div id="forgot-form-container" class="hidden">
                    <div id="forgot-error" class="error-message"></div>
                    <div id="forgot-success" class="success-message"></div>
                    <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:0.5rem;">Reset Password</h3>
                    <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1.5rem;">Enter your university email and we'll send you a reset link.</p>
                    <form id="forgot-form">
                        <div class="form-group">
                            <label for="forgot-email">University Email</label>
                            <input type="email" id="forgot-email" placeholder="e.g. john@westminster.ac.uk" required>
                        </div>
                        <button type="submit" class="btn-auth">Send Reset Link</button>
                    </form>
                    <div style="margin-top:1.25rem;text-align:center;">
                        <a href="#" class="forgot-link" id="back-to-login-link" style="font-size:0.85rem;">← Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
